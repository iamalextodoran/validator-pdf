name: ANAF D230 Validator
on:
  repository_dispatch:
    types: [run-validation]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '8' # ANAF foloseste versiuni mai vechi de Java, 8 e cea mai sigura
          distribution: 'temurin'

      - name: Run DUKIntegrator
        run: |
          # Cream fisierul XML
          echo '${{ github.event.client_payload.xml_data }}' > declaratie.xml
          
          # Rulam validarea. "|| true" forteaza GitHub sa continue chiar daca Java da eroare
          java -jar DUKIntegrator.jar -v D230 declaratie.xml log_validare.txt 0 0 || true
          
          echo "--- REZULTAT VALIDARE ANAF ---"
          if [ -f log_validare.txt ]; then
            cat log_validare.txt
          else
            echo "Eroare critica: Fisierul log_validare.txt nu a fost generat!"
            echo "Verifica daca DUKIntegrator.jar si folderul /lib exista in root."
          fi
          echo "------------------------------"

      - name: Salveaza Log-ul ca Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rezultat-validare
          path: log_validare.txt
