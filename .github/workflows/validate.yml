name: ANAF D230 Validator
on:
  repository_dispatch:
    types: [run-validation]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '8' # ANAF foloseste versiuni mai vechi de Java, 8 e cea mai sigura
          distribution: 'temurin'

      - name: Run DUKIntegrator
        run: |
          # Salvam XML-ul primit de la Next.js
          echo '${{ github.event.client_payload.xml_data }}' > declaratie.xml
          
          # Executam validarea (Soft J)
          # Presupunem ca DUKIntegrator.jar e in root
          java -jar DUKIntegrator.jar -v D230 declaratie.xml log_validare.txt 0 0
          
          # Citim rezultatul
          cat log_validare.txt
